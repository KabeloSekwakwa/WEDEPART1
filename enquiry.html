            <li><a href="about.html" style="background-color: #1A2A24; color: #F8F6F0; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: bold;">About Us</a></li>

    <hr>

    <main>
        <h2>Product & Order Enquiry</h2>
        <p>Have a question about a specific perfume or custom gift set? Fill out the form below.</p>

        <form action="#" method="post">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="product">Product of Interest:</label><br>
            <select id="product" name="product">
                <option value="velvet-rose">Velvet Rose & Vanilla</option>
                <option value="citrus-blossom">Citrus Blossom</option>
                <option value="midnight-leather">Midnight Leather & Cedar</option>
                <option value="ocean-mist">Ocean Mist & Vetiver</option>
                <option value="ocean-mist">Midnight Saffron & Oud</option>
                <option value="custom">Shadow Cedar & Cypress</option>
                <option value="custom">Custom Set / Wholesale Inquiry</option>
            </select><br><br>

            <label for="enquiry-details">Enquiry Details:</label><br>
            <textarea id="enquiry-details" name="enquiry-details" rows="5" cols="40" required></textarea><br><br>

            <input type="submit" value="Submit Enquiry">
        </form>
    </main>

    <hr>
